name: Publish to PyPI

on:
  push:
    branches: [main]
    paths:
      - "cost_prediction/**"
      - "pyproject.toml"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if already tagged
        id: check-tag
        run: |
          if git tag --list 'v*' --points-at HEAD | grep -q .; then
            echo "HEAD already tagged, skipping"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Compute next version
        if: steps.check-tag.outputs.skip != 'true'
        id: version
        run: |
          LATEST=$(git tag --list 'v*' --sort=-version:refname | head -1)
          if [ -z "$LATEST" ]; then
            NEXT="v0.1.0"
          else
            STRIPPED="${LATEST#v}"
            MAJOR=$(echo "$STRIPPED" | cut -d. -f1)
            MINOR=$(echo "$STRIPPED" | cut -d. -f2)
            PATCH=$(echo "$STRIPPED" | cut -d. -f3)
            NEXT="v${MAJOR}.${MINOR}.$((PATCH + 1))"
          fi
          echo "tag=$NEXT" >> $GITHUB_OUTPUT
          echo "Next tag: $NEXT"

      - name: Set up Python
        if: steps.check-tag.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        if: steps.check-tag.outputs.skip != 'true'
        run: pip install build

      - name: Bump version in pyproject.toml
        if: steps.check-tag.outputs.skip != 'true'
        run: |
          VERSION="${{ steps.version.outputs.tag }}"
          sed -i "s/^version = .*/version = \"${VERSION#v}\"/" pyproject.toml

      - name: Build package
        if: steps.check-tag.outputs.skip != 'true'
        run: python -m build

      - name: Commit version bump and tag
        if: steps.check-tag.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "release: ${{ steps.version.outputs.tag }}"
          git tag ${{ steps.version.outputs.tag }}
          git push origin HEAD ${{ steps.version.outputs.tag }}

      - name: Publish to PyPI
        if: steps.check-tag.outputs.skip != 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
