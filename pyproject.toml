[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cost-prediction"
version = "0.1.0"
description = "Cloud cost prediction engine — framework-agnostic, strategy-based"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Kai Yang", email = "kaiyang939325@gmail.com"},
]
keywords = ["cloud", "cost", "prediction", "forecasting", "finops", "multi-cloud"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Topic :: Office/Business :: Financial",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.urls]
Homepage = "https://github.com/Visionary-Future/billing-cost-prediction"
Repository = "https://github.com/Visionary-Future/billing-cost-prediction"
Documentation = "https://github.com/Visionary-Future/billing-cost-prediction#readme"

[project.optional-dependencies]
dev = [
    "build>=1.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.10"
strict = true

[[tool.mypy.overrides]]
module = "tests.*"
ignore_missing_imports = true
